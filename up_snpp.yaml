# Uttar Pradesh, 2019-2026 - Suomi-NPP VIIRS only.
#
# A single satellite gives the cleanest possible trend series: no platform mix
# to drift, no footprint mismatch, one continuous instrument record from
# 2012-01-20 to the present. Counts will be roughly half those of the
# S-NPP + NOAA-20 run, because two satellites see the same landscape twice.
#
# The trade-off: figure 08, the independent MODIS-vs-VIIRS cross-check, cannot
# be produced from one platform and is skipped. Keep the multi-platform run in
# output/up as the QC companion to this one.
#
#   firepipe plan -c up_snpp.yaml
#   firepipe run  -c up_snpp.yaml --density

project: up_agri_fires_snpp_2019_2026
out_dir: ./output/up_snpp          # separate from the multi-platform run

start_date: 2019-01-01
end_date: 2026-12-31

regions:
  - name: Uttar Pradesh
    gpkg: ./gpkg/uttar_pradesh_admin.gpkg
    boundary_layer: state_boundary
    admin_layer: district_boundary
    admin_field: DISTRICT
    parent_field: STATE_UT

seasons:
  drop_unassigned: true
  windows:
    - name: Rabi
      start: "03-01"
      end: "06-30"
      colour: "#F0A202"
      label: Rabi (wheat residue)
    - name: Kharif
      start: "10-01"
      end: "12-31"
      colour: "#EE3B33"
      label: Kharif (paddy residue)

sensors:
  platforms: [VIIRS_SNPP]   # SP to 2026-04-27, NRT beyond: continuous coverage
  processing: auto
  viirs_confidence: [h, n]
  modis_confidence_min: 30  # unused here, retained so the config stays portable
  daynight: both
  headline_platform_group: VIIRS

mask:
  kind: esa_worldcover
  esa_version: v200
  esa_year: 2021
  esa_remote: true
  crop_classes: [40]
  sampling: point
  cache_samples: true       # S-NPP points are already in the cache from the
                            # multi-platform run, so masking is near-instant

firms:
  cache_dir: ~/.cache/firepipe/firms
  bbox_strategy: per_region # same bbox as the previous run, so blocks are cached
  max_day_range: 5
  requests_per_10min: 4500

plots:
  enabled: true
  dpi: 200
  formats: [png]
  figures: [all]
  top_n_districts: 15
