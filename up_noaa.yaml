# Uttar Pradesh, 2019-2026 - NOAA-20 VIIRS only.
#
# Companion to up_snpp.yaml. Same instrument design, same 375 m footprint, but
# a different platform: NOAA-20 leads Suomi-NPP by roughly 50 minutes in the
# same afternoon orbit. Running both and comparing the trends is a genuine
# independent check, and a stronger one than MODIS-vs-VIIRS because the
# footprints are identical, so the counts are directly comparable.
#
# Archive coverage differs from S-NPP and matters here:
#   VIIRS_NOAA20_SP    2018-04-01 -> 2026-05-31
#   VIIRS_NOAA20_NRT   2026-06-01 -> present
# S-NPP reaches back to 2012-01-20; NOAA-20 only to April 2018. Both cover the
# 2019-2026 window in full, but do not extend this config earlier than 2019
# without checking `firepipe availability` first.
#
#   firepipe plan -c up_noaa.yaml
#   firepipe run  -c up_noaa.yaml --density --plots both

project: up_agri_fires_noaa20_2019_2026
out_dir: ./output/up_noaa20        # distinct: must not overwrite up_snpp

start_date: 2019-01-01
end_date: 2026-12-31

regions:
  - name: Uttar Pradesh
    gpkg: ./gpkg/uttar_pradesh_admin.gpkg
    boundary_layer: state_boundary
    admin_layer: district_boundary
    admin_field: DISTRICT
    parent_field: STATE_UT

seasons:
  drop_unassigned: true
  windows:
    - name: Rabi
      start: "03-01"
      end: "06-30"
      colour: "#F0A202"
      label: Rabi (wheat residue)
    - name: Kharif
      start: "10-01"
      end: "12-31"
      colour: "#EE3B33"
      label: Kharif (paddy residue)

sensors:
  platforms: [VIIRS_NOAA20]
  processing: auto          # SP to 2026-05-31, NRT beyond
  viirs_confidence: [h, n]
  modis_confidence_min: 30  # unused here; kept so the config stays portable
  daynight: both
  headline_platform_group: VIIRS

mask:
  kind: esa_worldcover
  esa_version: v200
  esa_year: 2021
  esa_remote: true
  crop_classes: [40]
  sampling: point
  cache_samples: true       # NOAA-20 coordinates are already cached from the
                            # multi-platform run, so masking is near-instant

firms:
  cache_dir: ~/.cache/firepipe/firms
  bbox_strategy: per_region # same bbox as output/up, so blocks are cached
  max_day_range: 5
  requests_per_10min: 4500

plots:
  enabled: true
  dpi: 200
  formats: [png]
  figures: [all]
  top_n_districts: 15
