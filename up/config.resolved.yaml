project: up_agri_fires_2019_2026
out_dir: ./output/up
start_date: '2019-01-01'
end_date: '2026-12-31'
regions:
- name: Uttar Pradesh
  gpkg: gpkg/uttar_pradesh_admin.gpkg
  boundary_layer: state_boundary
  admin_layer: district_boundary
  admin_field: DISTRICT
  parent_field: STATE_UT
  where: null
  bbox_pad_deg: 0.1
seasons:
  windows:
  - name: Rabi
    start: 03-01
    end: 06-30
    colour: '#F0A202'
    label: Rabi (wheat residue)
  - name: Kharif
    start: 10-01
    end: 12-31
    colour: '#EE3B33'
    label: Kharif (paddy residue)
  drop_unassigned: true
sensors:
  platforms:
  - VIIRS_SNPP
  - VIIRS_NOAA20
  - MODIS
  processing: auto
  viirs_confidence:
  - h
  - n
  modis_confidence_min: 30
  daynight: both
  headline_platform_group: VIIRS
mask:
  kind: esa_worldcover
  esa_version: v200
  esa_year: 2021
  esa_remote: true
  dw_project: null
  dw_reducer: mode
  raster_path: null
  crop_classes:
  - 40
  sampling: point
  min_crop_fraction: 0.5
  footprint_radius_m:
    VIIRS: 187.5
    MODIS: 500.0
  cache_dir: ~/.cache/firepipe/masks
  cache_samples: true
firms:
  map_key: null
  cache_dir: ~/.cache/firepipe/firms
  max_day_range: 5
  requests_per_10min: 4500
  bbox_strategy: per_region
  timeout_s: 120
  max_retries: 4
plots:
  enabled: true
  dpi: 200
  formats:
  - png
  figures:
  - all
  detail_window: null
  annotate_covid: false
  covid_year: 2020
  top_n_districts: 15
