[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "firepipe"
version = "1.1.0"
description = "Configurable NASA FIRMS agricultural-fire extraction, masking and figure pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "requests>=2.31",
  "pyyaml>=6.0",
  "pydantic>=2.5",
  "geopandas>=1.0",
  "pyogrio>=0.7",
  "shapely>=2.0",
  "rasterio>=1.3",
  "matplotlib>=3.7",
  "pyarrow>=14.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dynamicworld = ["earthengine-api>=0.1.380"]
dev = ["pytest>=7.4"]
all = ["mcp>=1.2", "earthengine-api>=0.1.380", "pytest>=7.4"]

[project.scripts]
firepipe = "firepipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
