name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is what the pipeline is developed against; 3.10 is the floor
        # declared in pyproject.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        # The suite is entirely offline: FIRMS responses are mocked and
        # rasters are synthesised, so CI needs no MAP_KEY and no network.
        run: pytest -q

      - name: Check the CLI starts
        run: |
          firepipe --help
          firepipe init -o /tmp/config.yaml
          test -s /tmp/config.yaml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Lint
        run: ruff check src tests --select E9,F63,F7,F82
      - name: Guard against committed secrets
        run: |
          # A FIRMS MAP_KEY is 32 hex characters. Fail loudly if one appears
          # anywhere in the tree.
          if grep -rInE '[0-9a-f]{32}' --include='*.py' --include='*.yaml' \
               --include='*.yml' --include='*.md' . ; then
            echo "::error::Possible MAP_KEY committed - rotate it and remove from history"
            exit 1
          fi
          echo "No 32-hex-character strings found."
