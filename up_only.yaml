# Uttar Pradesh only, 2019-2026.
#
# Conservative FIRMS settings: smaller day blocks and a per-region bounding box.
# This is the configuration to fall back to when the four-state union query is
# rejected. It costs more requests but each one is far smaller.
#
#   firepipe plan -c up_only.yaml
#   firepipe run  -c up_only.yaml --density

project: up_agri_fires_2019_2026
out_dir: ./output/up

start_date: 2019-01-01
end_date: 2026-12-31

regions:
  - name: Uttar Pradesh
    gpkg: ./gpkg/uttar_pradesh_admin.gpkg
    boundary_layer: state_boundary
    admin_layer: district_boundary
    admin_field: DISTRICT
    parent_field: STATE_UT

seasons:
  drop_unassigned: true
  windows:
    - name: Rabi
      start: "03-01"
      end: "06-30"
      colour: "#F0A202"
      label: Rabi (wheat residue)
    - name: Kharif
      start: "10-01"
      end: "12-31"
      colour: "#EE3B33"
      label: Kharif (paddy residue)

sensors:
  platforms: [VIIRS_SNPP, VIIRS_NOAA20, MODIS]
  processing: auto          # set to NRT if the diagnostic blames SP
  viirs_confidence: [h, n]
  modis_confidence_min: 30
  daynight: both
  headline_platform_group: VIIRS

mask:
  kind: esa_worldcover
  esa_version: v200
  esa_year: 2021
  esa_remote: true
  crop_classes: [40]
  sampling: point

firms:
  cache_dir: ~/.cache/firepipe/firms
  bbox_strategy: per_region   # UP's own box, not a four-state union
  max_day_range: 5            # smaller blocks: ~344 requests/platform
  requests_per_10min: 4500

plots:
  enabled: true
  dpi: 200
  formats: [png]
  figures: [all]
  top_n_districts: 15
