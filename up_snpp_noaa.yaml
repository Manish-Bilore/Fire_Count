# Uttar Pradesh, 2019-2026 - Suomi-NPP and NOAA-20 VIIRS, pooled.
#
# `headline_platform_group: VIIRS` already sums every VIIRS satellite listed
# under `platforms`, so this config pools S-NPP and NOAA-20 into one series.
# 'BOTH' is not the right setting here: it means pooling VIIRS *with MODIS*
# across instruments, and the config loader rejects it when MODIS is absent.
#
# THIS IS THE SOUNDEST POOLED SERIES AVAILABLE FROM THIS DATA
#
# Unlike a MODIS + VIIRS sum, the two instruments here are the same design at
# the same 375 m resolution, in the same afternoon orbit about 50 minutes
# apart. So:
#
#   * Footprints match exactly. No mixed-resolution artefact, and the two
#     platforms' counts are comparable in level, not merely in direction.
#   * Coverage roughly doubles. Two overpasses per afternoon instead of one
#     catches short-lived residue fires that a single satellite misses between
#     passes. This is the real reason to pool.
#   * The sum is still a detection count, not a fire count. A fire burning
#     across both overpasses is counted twice. That is true of any single
#     platform across consecutive days too, but pooling roughly doubles the
#     rate at which it happens.
#
# Every figure states "S-NPP + NOAA-20 pooled" in its title, so the caveat
# survives into the simple plots, which carry no captions.
#
# The one asymmetry to watch: S-NPP archives back to 2012-01-20, NOAA-20 only
# to 2018-04-01. Both cover 2019-2026 in full, so this config is safe as
# written, but do not extend start_date earlier without re-checking, or the
# early years would silently be S-NPP alone while later years are the sum of
# two - a step change that looks exactly like a rise in burning.
#
#   Archive coverage:
#     VIIRS_SNPP_SP     2012-01-20 -> 2026-04-27,  NRT 2026-04-28 -> present
#     VIIRS_NOAA20_SP   2018-04-01 -> 2026-05-31,  NRT 2026-06-01 -> present
#
# Compare against up_snpp.yaml and up_noaa.yaml, the single-platform runs. If
# the pooled series and both singles point the same way, the trend is not an
# artefact of platform choice.
#
#   firepipe plan -c up_snpp_noaa.yaml
#   firepipe run  -c up_snpp_noaa.yaml --density --plots both

project: up_agri_fires_snpp_noaa_2019_2026
out_dir: ./output/up_snpp_noaa

start_date: 2019-01-01
end_date: 2026-12-31

regions:
  - name: Uttar Pradesh
    gpkg: ./gpkg/uttar_pradesh_admin.gpkg
    boundary_layer: state_boundary
    admin_layer: district_boundary
    admin_field: DISTRICT
    parent_field: STATE_UT

seasons:
  drop_unassigned: true
  windows:
    - name: Rabi
      start: "03-01"
      end: "06-30"
      colour: "#F0A202"
      label: Rabi (wheat residue)
    - name: Kharif
      start: "10-01"
      end: "12-31"
      colour: "#EE3B33"
      label: Kharif (paddy residue)

sensors:
  platforms: [VIIRS_SNPP, VIIRS_NOAA20]
  processing: auto
  viirs_confidence: [h, n]
  modis_confidence_min: 30        # unused here; kept so the config stays portable
  daynight: both
  headline_platform_group: VIIRS  # pools every VIIRS satellite listed above

mask:
  kind: esa_worldcover
  esa_version: v200
  esa_year: 2021
  esa_remote: true
  crop_classes: [40]
  sampling: point
  cache_samples: true             # both platforms' coordinates are already cached

firms:
  cache_dir: ~/.cache/firepipe/firms
  bbox_strategy: per_region       # same bbox as earlier UP runs, so blocks are cached
  max_day_range: 5
  requests_per_10min: 4500

plots:
  enabled: true
  dpi: 200
  formats: [png]
  figures: [all]
  top_n_districts: 15
